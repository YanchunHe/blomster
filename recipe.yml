# ------------------------------------------------------------
#   Configuration for the tool 
# ------------------------------------------------------------
blomster:
  version     : 0.1
  source_root : /nird/datalake/NS16000B/blomster
  work_root   : /scratch/yanchun/blomster
  # overwrite cached climatologies and time series, True/False
  overwrite   : True

# ------------------------------------------------------------
#   Configuration for the simulation
# ------------------------------------------------------------
experiment:

  caseid      : N1850frc2_f09_tn14_20191012
  input_root  : /nird/datalake/NS9560K/noresm/cases
  grid_label  : tnx1v4
  year_start  : 1421
  year_end    : 1450

# ------------------------------------------------------------
#   Configuration for generated Jupyter Book
# ------------------------------------------------------------
jupyterbook:
  www_root    : /nird/datalake/NS9560K/www/diagnostics/blomster/yanchun

# -----------------------------------------
#   Configuration for required variables
# -----------------------------------------
variables:                        # required variables
  blom:                           # ocean component
    hy:                           # file tag
      climo: ['templvl','salnlvl']
#       'idlagelvl',
#       'uvellvl','vvellvl', # rotate first
      timeseries: []
#   hbgcy:
#     climo: ['co2fxd','co2fxu']
#     timeseries: ['co2fxd','co2fxu']
    hm:
      climo: ['sst','sss',
        'templvl','salnlvl']
#       'mldb04'
      timeseries: ['sstga','sssga','tempga','salnga',
        'volgs','massgs',
        'masstr','heattr','salttr',
        'mhflx','mhftd','mhfsm','mhfld',
        'msflx','msftd','msfsm','msfld',
        'mmflxl','mmftdl','mmfsml',
        'mmflxd','mmftdd','mmfsmd']
    hbgcm:
      climo: []
      timeseries: []

# cice:
#   h:
#     climo: ['aice']
#     timeseries: []
#   h1:
#     climo: []
#     timeseries: []


# ------------------------------------------------------------
#   Jupyter notebooks for diagnostics
# ------------------------------------------------------------
diagnostics:
  root: index
  chapters:
    - file: BLOM/intro.ipynb
      sections:
        - file: BLOM/timeseries/intro.ipynb
          sections:
            - file: BLOM/timeseries/transports.ipynb
            - file: BLOM/timeseries/global_averages.ipynb
            - file: BLOM/timeseries/AMOC.ipynb
        - file: BLOM/climatologies/intro.ipynb
          sections:
            - file: BLOM/climatologies/annual.ipynb
            - file: BLOM/climatologies/seasonal.ipynb
        - file: BLOM/MOC/intro.md
          sections:
            - file: BLOM/MOC/MOC.ipynb
        - file: BLOM/ENSO/ENSO.ipynb
        - file: BLOM/meridional_fluxes/meridional_fluxes.ipynb
        - file: BLOM/zonal_mean/zonal_mean.ipynb
        - file: BLOM/AO/intro.ipynb
          sections:
  #         - file: BLOM/AO/Arctic_Ocean.ipynb
            - file: BLOM/AO/Profiles.ipynb
            - file: BLOM/AO/Sections.ipynb
    - file: HAMOCC/intro.ipynb
    - file: CICE/intro.ipynb

# ------------------------------------------------------------
#   Model grid files
# ------------------------------------------------------------
grids:
  tnx1v4:
    data_root: /nird/datalake/NS16000B/blomster/grids/tnx1v4
    grid_file: /nird/datalake/NS16000B/blomster/grids/tnx1v4/grid.nc
    region_file: /nird/datalake/NS16000B/blomster/grids/tnx1v4/regions.nc
    section_file: /nird/datalake/NS16000B/blomster/grids/tnx1v4/section_index_tnx1v4_20190611.dat
    mask_RECCAP2_file: /nird/datalake/NS16000B/blomster/grids/tnx1v4/RECCAP2_region_masks_all_v20221025_tnx1v4.nc
    mask_nino3: /nird/datalake/NS16000B/blomster/grids/tnx1v4/mask_nino3.nc
    mask_nino34: /nird/datalake/NS16000B/blomster/grids/tnx1v4/mask_nino34.nc
  tnx025v4:
    data_root: /nird/datalake/NS16000B/blomster/grids/tnx025v4
    grid_file: /nird/datalake/NS16000B/blomster/grids/tnx025v4/grid.nc
    region_file: /nird/datalake/NS16000B/blomster/grids/tnx025v4/regions.nc
    section_file: /nird/datalake/NS16000B/blomster/grids/tnx025v4/section_index.dat
    mask_RECCAP2_file: /nird/datalake/NS16000B/blomster/grids/tnx025v4/RECCAP2_region_masks_all_v20221025_tnx025v4.nc
    mask_nino3: /nird/datalake/NS16000B/blomster/grids/tnx025v4/mask_nino3.nc
    mask_nino34: /nird/datalake/NS16000B/blomster/grids/tnx025v4/mask_nino34.nc


